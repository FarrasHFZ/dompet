name: Deploy web to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'swing-screener/web/**'
      - 'swing-screener/tools/**'
      - 'swing-screener/apps-script/**'
      - 'swing-screener/data/ownership.json'
      - 'swing-screener/data/backtest-summary.json'
      - 'swing-screener/data/news-accuracy.json'
      - '.github/workflows/pages.yml'
  schedule:
    # All times UTC (WIB = UTC+7). News is continuous, so refresh hourly around the clock...
    - cron: '0 * * * *'
    # ...and every 30 min during IDX hours (09:00-16:30 WIB) for live quotes.
    - cron: '30 2-9 * * 1-5'
    # End-of-day run 17:35 WIB: the only one that commits the forward-test ledger.
    - cron: '35 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write   # commits the forward-test ledger (swing-screener/data/history)
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keep the 35-day headline archive (and its month back-fill progress) between runs (Google News sometimes refuses the runner) without committing every run.
      - uses: actions/cache@v4
        with:
          path: |
            swing-screener/data/news-store.json
            swing-screener/data/alert-state.json
          key: news-cache-${{ github.run_id }}
          restore-keys: news-cache-

      # News falls back to data/news-cache.json when Google News blocks the runner (it answered 503 once).
      # Rebuild the screener snapshot (Yahoo prices + Google News + ownership). If a source blocks the
      # runner, the step fails softly and the last committed swing-screener/web/data/latest.json is served.
      - name: Build screener snapshot
        id: snap
        continue-on-error: true
        working-directory: swing-screener
        env:
          # Optional Telegram alerts: set both repo secrets (see swing-screener/README.md). Without them alerts are skipped.
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node tools/build-snapshot.mjs

      - name: Log picks to the forward-test ledger
        if: steps.snap.outcome == 'success' && (github.event_name != 'schedule' || github.event.schedule == '35 10 * * 1-5')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add swing-screener/data/history swing-screener/data/ownership-history swing-screener/data/history-mom
          git diff --cached --quiet || (git commit -m "screener: log picks $(date -u +%F)" && git push)

      - name: Assemble site (Dompet at /, screener at /screener/)
        run: |
          mkdir -p _site/screener
          cp -r web/. _site/
          cp -r swing-screener/web/. _site/screener/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
